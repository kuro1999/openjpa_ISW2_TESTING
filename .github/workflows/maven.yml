name: Java CI

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run selected unit and Randoop tests
        run: >
          mvn -pl openjpa-jdbc
          -Dcheckstyle.skip=true
          -Drat.skip=true
          -Dtest=org.apache.openjpa.jdbc.identifier.DBIdentifierUtilImplTest,org.apache.openjpa.jdbc.identifier.DBIdentifierUtilImplGuidedTreeRepairedTest,org.apache.openjpa.jdbc.identifier.randoop.DBIdentifierUtilImplRandoopTest,org.apache.openjpa.jdbc.identifier.randoop.DBIdentifierUtilImplRandoopTest0,org.apache.openjpa.jdbc.identifier.randoop.DBIdentifierUtilImplRandoopTest1,org.apache.openjpa.jdbc.meta.MappingRepositoryTest,org.apache.openjpa.jdbc.meta.Randoop.MappingRepositoryRandoopTest,org.apache.openjpa.jdbc.meta.Randoop.MappingRepositoryRandoopTest0
          test

      - name: Run selected integration tests
        run: >
          mvn -pl openjpa-jdbc
          -Dcheckstyle.skip=true
          -Drat.skip=true
          -Dit.test=org.apache.openjpa.jdbc.meta.MappingRepositoryIT
          test-compile
          org.apache.maven.plugins:maven-failsafe-plugin:3.5.2:integration-test
          org.apache.maven.plugins:maven-failsafe-plugin:3.5.2:verify
